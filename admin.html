<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kashmiri Shawl House | Admin</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f2eb;
      color: #222;
    }
    header {
      background: #111;
      color: #d8b45a;
      padding: 22px;
      text-align: center;
    }
    main {
      max-width: 700px;
      margin: 30px auto;
      padding: 20px;
    }
    .panel {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 3px 15px #00000012;
    }
    label {
      display: block;
      margin-top: 16px;
      font-weight: bold;
    }
    input, textarea, select {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font: inherit;
    }
    button {
      margin-top: 20px;
      padding: 13px 18px;
      border: 0;
      border-radius: 6px;
      background: #b99a4a;
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }
    .note {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <header>
    <h1>Kashmiri Shawl House</h1>
    <p>Product Admin Panel</p>
  </header>

  <main>
    <div class="panel">
      <h2>Add New Product</h2>
      <p class="note">Use this panel to prepare your product details.</p>

      <form id="productForm">
        <label for="name">Product Name</label>
        <input id="name" type="text" required
               placeholder="e.g. Premium Pashmina Shawl">

        <label for="price">Price (INR)</label>
        <input id="price" type="number" min="0" required
               placeholder="Enter price">

        <label for="category">Collection</label>
        <select id="category" required>
          <option value="">Select collection</option>
          <option>New Arrivals</option>
          <option>Pashmina Collection</option>
          <option>Premium Collection</option>
          <option>Winter Collection</option>
        </select>

        <label for="photo">Product Photo</label>
        <input id="photo" type="file" accept="image/*" required>

        <label for="description">Description</label>
        <textarea id="description" rows="4" required
                  placeholder="Describe the product"></textarea>

        <button type="submit">Save Product</button>
      </form>

      <p class="note">
        This is the initial interface only. Products are not saved or
        published yet; database and secure image upload must be connected.
      </p>
    </div>
  </main>

  <script>
    document.getElementById("productForm").addEventListener("submit", function(event) {
      event.preventDefault();
      alert("Admin interface ready. Database connection is the next step.");
    });
  </script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import {
  getFirestore, collection, addDoc, getDocs,
  doc, updateDoc, deleteDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDeFQB3iMiTr7QDwjQW1nxpEdYpfmcBRzc",
  authDomain: "kashmiri-shawl-house.firebaseapp.com",
  projectId: "kashmiri-shawl-house",
  storageBucket: "kashmiri-shawl-house.firebasestorage.app",
  messagingSenderId: "835316672741",
  appId: "1:835316672741:web:4a1010af10e8904cb54c0c",
  measurementId: "G-HT079L4276"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const form = document.getElementById("productForm");

const login = document.createElement("section");
login.innerHTML = `
  <div class="panel" style="margin-bottom:20px">
    <h2>Admin Login</h2>
    <input id="adminEmail" type="email" placeholder="Admin email">
    <input id="adminPassword" type="password" placeholder="Password">
    <button id="loginBtn">Login</button>
    <button id="logoutBtn" hidden>Logout</button>
    <p id="status" role="status"></p>
  </div>`;
document.querySelector("main").prepend(login);

const status = document.getElementById("status");
const saveButton = form.querySelector('button[type="submit"]');
const photoInput = document.getElementById("photo");

const category = document.getElementById("category");
category.innerHTML = `
  <option value="">Select collection</option>
  <option>All Shawls</option>
  <option>Kalamkari Suits</option>
  <option>Stoles</option>
  <option>Premium Collection</option>
  <option>New Arrivals</option>`;

const subcategory = document.createElement("input");
subcategory.id = "subcategory";
subcategory.placeholder = "Subcategory (e.g. Pashmina)";
const descriptionLabel = document.querySelector('label[for="description"]');
descriptionLabel.before(subcategory);
subcategory.insertAdjacentHTML("beforebegin",
  '<label for="subcategory">Subcategory</label>');

const imageUrl = document.createElement("input");
imageUrl.id = "imageUrl";
imageUrl.type = "url";
imageUrl.placeholder = "Product image URL (Cloudinary link)";
photoInput.after(imageUrl);
photoInput.required = false;
imageUrl.insertAdjacentHTML("beforebegin",
  '<label for="imageUrl">Uploaded Image URL</label>');

const list = document.createElement("section");
list.innerHTML = "<h2>Existing Products</h2><div id='productsList'></div>";
form.parentElement.append(list);

let editingId = null;

onAuthStateChanged(auth, user => {
  form.hidden = !user;
  list.hidden = !user;
  document.getElementById("logoutBtn").hidden = !user;
  document.getElementById("loginBtn").hidden = !!user;
  document.getElementById("adminEmail").hidden = !!user;
  document.getElementById("adminPassword").hidden = !!user;
  status.textContent = user ? "Logged in: " + user.email : "Please log in.";
  if (user) loadProducts();
});

document.getElementById("loginBtn").onclick = async () => {
  try {
    await signInWithEmailAndPassword(
      auth,
      document.getElementById("adminEmail").value.trim(),
      document.getElementById("adminPassword").value
    );
  } catch (e) {
    status.textContent = "Login failed: " + e.message;
  }
};

document.getElementById("logoutBtn").onclick = () => signOut(auth);

async function loadProducts() {
  const container = document.getElementById("productsList");
  container.textContent = "Loading products...";
  try {
    const snap = await getDocs(collection(db, "Products"));
    container.replaceChildren();

    snap.forEach(item => {
      const p = item.data();
      const card = document.createElement("div");
      card.className = "panel";
      card.style.marginTop = "12px";

      const title = document.createElement("h3");
      title.textContent = p.name || "Unnamed product";
      const info = document.createElement("p");
      info.textContent = `${p.category || ""} · ₹${p.price ?? ""}`;

      const edit = document.createElement("button");
      edit.textContent = "Edit";
      edit.onclick = () => {
        document.getElementById("name").value = p.name || "";
        document.getElementById("price").value = p.price ?? "";
        category.value = p.category || "";
        subcategory.value = p.subcategory || "";
        document.getElementById("description").value = p.description || "";
        imageUrl.value = p.imageUrl || "";
        editingId = item.id;
        saveButton.textContent = "Update Product";
        form.scrollIntoView({behavior:"smooth"});
      };

      const del = document.createElement("button");
      del.textContent = "Delete";
      del.style.marginLeft = "8px";
      del.onclick = async () => {
        if (!confirm("Delete this product?")) return;
        try {
          await deleteDoc(doc(db, "Products", item.id));
          await loadProducts();
          status.textContent = "Product deleted.";
        } catch (e) {
          status.textContent = "Delete failed: " + e.message;
        }
      };

      card.append(title, info, edit, del);
      container.append(card);
    });

    if (snap.empty) container.textContent = "No products yet.";
  } catch (e) {
    container.textContent = "Could not load products: " + e.message;
  }
}

form.addEventListener("submit", async event => {
  event.preventDefault();

  if (!auth.currentUser) {
    status.textContent = "Please log in first.";
    return;
  }

  const file = photoInput.files[0];
  let uploadedImageUrl = imageUrl.value.trim();

  if (!file && !uploadedImageUrl) {
    status.textContent = "Please select a product photo.";
    return;
  }

  saveButton.disabled = true;
  status.textContent = file
    ? "Uploading photo..."
    : "Saving product...";

  try {
    // Upload the selected photo to Cloudinary
    if (file) {
      const uploadData = new FormData();
      uploadData.append("file", file);
      uploadData.append(
        "upload_preset",
        "kashmiri_shawl_products"
      );

      const response = await fetch(
        "https://api.cloudinary.com/v1_1/zvtpidgt/image/upload",
        {
          method: "POST",
          body: uploadData
        }
      );

      const result = await response.json();

      if (!response.ok || !result.secure_url) {
        throw new Error(
          result.error?.message || "Photo upload failed."
        );
      }

      uploadedImageUrl = result.secure_url;
    }

    // Prepare product details for Firebase
    const product = {
      name: document.getElementById("name").value.trim(),
      price: Number(document.getElementById("price").value),
      category: category.value,
      subcategory: subcategory.value.trim(),
      description: document.getElementById("description").value.trim(),
      imageUrl: uploadedImageUrl,
      updatedAt: serverTimestamp()
    };

    if (editingId) {
      await updateDoc(
        doc(db, "Products", editingId),
        product
      );
      status.textContent = "Product updated successfully!";
    } else {
      product.createdAt = serverTimestamp();

      await addDoc(
        collection(db, "Products"),
        product
      );

      status.textContent = "Product added successfully!";
    }

    form.reset();
    editingId = null;
    saveButton.textContent = "Save Product";

    await loadProducts();

  } catch (e) {
    status.textContent = "Error: " + e.message;
  } finally {
    saveButton.disabled = false;
  }
});
</script>
</body>
</html>
